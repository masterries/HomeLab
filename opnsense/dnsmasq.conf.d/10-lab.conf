# 10-lab.conf - drop-in for OPNsense's dnsmasq (installed by scripts/commands/firewall.ps1 into
# /usr/local/etc/dnsmasq.conf.d/, which OPNsense's generated dnsmasq.conf includes via conf-dir).
#
# Split-horizon DNS: a published name such as element.lab.internal has two addresses in the
# hosts data, the lab IP of its VM (10.10.10.30, matrix) and the VM's published virtual IP
# (10.10.99.3); both are generated from "published" in config/lab.json. With
# localise-queries, dnsmasq answers each client only with the address(es) in the subnet the
# query arrived on:
#   your PC asks on the HOST interface (10.10.99.0/24)  -> 10.10.99.3, forwarded by the firewall
#   a lab VM asks on the LAN interface (10.10.10.0/24)   -> 10.10.10.30, the VM itself
# Names with only one address are answered the same way on both sides.
#
# OPNsense has no GUI setting for this option. Files in conf-dir are not part of config.xml
# (not in backups, not in the API), so every firewall build installs this file again.
localise-queries
