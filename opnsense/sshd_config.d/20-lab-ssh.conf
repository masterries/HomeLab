# /usr/local/etc/ssh/sshd_config.d/20-lab-ssh.conf on the firewall - installed by
# scripts/commands/firewall.ps1 (Update-FirewallSsh) on every run, with the {{...}} placeholders
# filled in from config/lab.json.
#
# OPNsense writes its sshd_config itself (from config.xml); the first line it writes is
# "Include /usr/local/etc/ssh/sshd_config.d/*.conf", and sshd keeps the FIRST value it sees for
# each option, so the values here win. Only global options, no "Match" block.
#
# The firewall is the lab's jump host (bastion): every SSH login from the PC (and Vagrant's)
# passes through it. So it is locked down to exactly that job:
#   HostCertificate  the firewall's host certificate (signed by a lab SSH CA), next to the host
#                    keys OPNsense keeps in /conf/sshd. Clients check it instead of trusting the
#                    key on first use.
#   AllowUsers       ansible, from the PC and from ansible-control only. (The user trust itself,
#                    which SSH CAs may log in, is in the authorized_keys of ansible:
#                    "cert-authority" lines in config.xml, opnsense/lab-ssh-trust.php.)
#   PermitOpen       the only places a login may forward to: SSH (port 22) of the lab VMs, by
#                    address (Vagrant's "ssh -W <ip>:22") and by name (ProxyJump). No tunnels to
#                    anything else, no remote forwarding.
HostCertificate /conf/sshd/ssh_host_ed25519_key-cert.pub
AllowUsers {{ALLOW_USERS}}
AllowTcpForwarding local
PermitOpen {{PERMIT_OPEN}}
AllowAgentForwarding no
AllowStreamLocalForwarding no
PermitTunnel no
X11Forwarding no
