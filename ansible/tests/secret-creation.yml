# ansible/tests/secret-creation.yml -- run on ansible-control by tests/Test-LabSecretCreation.ps1 (profile test-secret-creation)
# (through bin/openbao-run, policy ansible-keycloak): the "create a missing secret" path of
# playbooks/tasks/openbao-secrets.yml, on a throwaway path that no service uses.
#
# Prints only the number of secrets read and the LENGTH of the value, never the value.
- name: Test the create path of tasks/openbao-secrets.yml
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read or create the throwaway secret keycloak/test-generated
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../playbooks/tasks/openbao-secrets.yml"
      vars:
        openbao_secrets:
          - { path: keycloak/test-generated, field: password, policy: lab-alnum-24 }
        openbao_existing_state: false

    - name: Result (length only)
      ansible.builtin.debug:
        msg: "secrets={{ lab_secrets | length }} length={{ (lab_secrets['keycloak/test-generated'] | default('')) | length }}"
