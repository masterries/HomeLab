# inventory/hosts.ini -- the Ansible inventory: which machines the lab has and how they are
# grouped
#
# Where it is used:
#   Read by ansible-playbook on ansible-control (as user "ansible"); ansible.cfg points to it
#   with "inventory = inventory/hosts.ini".
#
# Concepts:
#   - Inventory: the list of hosts Ansible manages. Each host line starts with the inventory
#     name (available in playbooks as "inventory_hostname"), optionally followed by
#     per-host variables in the form key=value.
#   - Groups: "[name]" starts a group. Playbooks target groups ("hosts: web"), not single
#     machines, so a second web server would be one more line here, without touching any
#     playbook. The built-in group "all" always contains every host.
#   - Group variables: a file inventory/group_vars/<group>.yml is loaded automatically for the
#     hosts of that group; group_vars/all.yml applies to every host.
#
# Hosts are addressed by their DNS names in the lab network (*.lab.internal), which dnsmasq on
# the firewall answers, not by IP addresses. The IPs themselves are fixed by DHCP reservations
# on the firewall (MAC address -> IP, generated by scripts/New-LabFirewall.ps1 from
# config/lab.json); with names, this file does not need to repeat them.
#
# Note: keep comments on their own lines in this file. Ansible accepts a trailing "# ..." on a
# host line, but not everywhere: in a [group:vars] section it could become part of the value.

# The perimeter firewall (OPNsense, FreeBSD based): router between the lab and the outside,
# DNS/DHCP server, SSH jump host. "ansible_host" is the address Ansible connects to; the
# inventory name stays short. Ansible's modules run on it with the Python that OPNsense ships
# (/usr/local/bin/python3), found by Ansible's interpreter discovery. Its configuration is
# better changed through OPNsense's REST API than by editing files, because OPNsense
# regenerates its files from config.xml.
[firewalls]
firewall ansible_host=firewall.lab.internal

# The control node itself. "ansible_connection=local" runs its tasks directly on this machine
# instead of logging in to itself over SSH.
[control]
ansible-control ansible_connection=local

# The Matrix stack (Synapse, MAS, Element Web, LiveKit), deployed by matrix-docker-ansible-deploy
# through scripts/Deploy-LabMatrix.ps1. MDAD uses its own inventory (ansible/matrix/inventory/);
# this entry is for the lab's own playbooks (ping.yml, matrix-prepare.yml). Groups are named by
# role and hosts by machine; a group and a host with the same name would be ambiguous (Ansible
# warns about it).
[matrix_servers]
matrix ansible_host=matrix.lab.internal

# Keycloak, the identity provider (playbooks/keycloak.yml, scripts/Deploy-LabKeycloak.ps1).
[keycloak_servers]
keycloak ansible_host=keycloak.lab.internal

# OpenBao, the secrets manager and certificate authority (playbooks/openbao.yml,
# scripts/Deploy-LabVault.ps1).
[vault_servers]
vault ansible_host=vault.lab.internal

# Web servers for the first demo, playbooks/hello-nginx.yml. Empty since the Matrix stack
# replaced it; to try it, add a VM here (and see the playbook's header).
[web]
