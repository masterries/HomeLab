# inventory/group_vars/all.yml -- variables available to every host in the inventory
#
# Where it is used:
#   Loaded automatically by ansible-playbook on ansible-control: files in group_vars/ next to
#   the inventory are matched to groups by name, and "all" is the built-in group that contains
#   every host. More specific sources take precedence over these values, e.g.
#   group_vars/web.yml, host_vars/<host>.yml or "vars:" in a play.
#
# Why a variables file: values used by several playbooks are defined once here instead of
# being repeated in each playbook.

# The lab's PKI, two levels as in enterprises: an offline root CA on the PC
# (scripts/lib/LabPki.ps1, key encrypted, used only for a few signatures) and an
# intermediate CA inside OpenBao that issues the everyday certificates (Keycloak's by CSR
# signing, Matrix's through ACME). Only PUBLIC files of it are on ansible-control, copied by
# lab.ps1 run from keys\pki on the PC: root-ca.crt (PEM, put into the VMs' trust
# stores) and pub/root-ca.{crt,crl} (DER, served by the vault VM for revocation checks).
# A lookup always runs on the control node, so HOME is the home directory of the user running
# ansible-playbook there, even when the variable is used in a task for another host.
lab_pki_dir: "{{ lookup('env', 'HOME') }}/lab-pki"
# OpenBao: secrets manager and intermediate CA (playbooks/openbao.yml, lab.ps1 deploy vault).
lab_vault_url: "https://vault.{{ lab_domain }}:8200"
# config/lab.json, the lab's main source of data (VMs, addresses, domain). Every run gets a fresh
# copy in ~/lab/config/ (ansible/bin/lab-run), so the playbooks read the same values as the PC.
lab_config: "{{ lookup('file', inventory_dir ~ '/../config/lab.json') | from_json }}"
# The lab's internal DNS domain, from config/lab.json. ".internal" is reserved for private
# networks and never used on the public internet, so lab names cannot collide with real ones.
# Copies kept by hand: the Windows NRPT rule (scripts/host/Initialize-LabHost.ps1) and
# matrix_domain (ansible/matrix/inventory/host_vars/matrix.lab.internal/vars.yml). The lab's CAs
# carry it as a name constraint (scripts/lib/LabPki.ps1): they can only certify names under it.
lab_domain: "{{ lab_config.domain }}"

# ---------------------------------------------------------------------------------------------
# Single sign-on: Keycloak (identity provider) and the Matrix Authentication Service (MAS)
# ---------------------------------------------------------------------------------------------
# These values are the "contract" between the two sides of an OpenID Connect (OIDC) login, so
# they are defined once here: playbooks/keycloak.yml configures Keycloak with them, and
# playbooks/matrix-prepare.yml hands them to the Matrix stack (MAS). If one side had a different
# value, logins would fail with errors such as "Invalid parameter: redirect_uri".
#
# Keycloak's public URL. Keycloak builds every URL it shows (login pages, the issuer in its
# tokens) from this exact value, no matter whether a request comes from your PC (through the
# firewall's published address 10.10.99.4) or from the Matrix VM inside the lab.
lab_keycloak_url: "https://keycloak.{{ lab_domain }}"
# A realm is Keycloak's unit of separation: its own users, clients and settings. "master" is
# reserved for administering Keycloak itself; the lab's users live in the realm "lab".
lab_keycloak_realm: lab
# The issuer identifies the identity provider in OIDC. Clients (here MAS) compare it exactly,
# character by character, with what Keycloak publishes at <issuer>/.well-known/openid-configuration.
lab_keycloak_issuer: "{{ lab_keycloak_url }}/realms/{{ lab_keycloak_realm }}"
# Keycloak's administrator login for the admin console (https://keycloak.lab.internal/admin/),
# and the client Ansible uses for Keycloak's admin API (OAuth2 "client credentials", no person).
lab_keycloak_admin_user: admin
lab_keycloak_ansible_client_id: lab-ansible
# Where keycloak.yml kept its secrets before OpenBao (it removes the folder; the secrets are in
# OpenBao now, see playbooks/vars/keycloak-secrets.yml).
keycloak_secrets_dir: "{{ lookup('env', 'HOME') }}/keycloak-secrets"
# Where MAS is reachable: matrix-docker-ansible-deploy serves it at matrix.<domain> under the
# path /auth (matrix_server_fqn_matrix + matrix_authentication_service_path_prefix).
lab_mas_public_base: "https://matrix.{{ lab_domain }}/auth/"
# The OIDC client in Keycloak that represents MAS.
lab_mas_keycloak_client_id: matrix-authentication-service
# MAS identifies each upstream identity provider by a ULID (a sortable unique ID, 26 characters
# of Crockford base32). It appears in the redirect URI registered in Keycloak, and MAS stores
# every "this Keycloak user is that Matrix user" link under it. NEVER change it after the first
# login: all links would be lost. Any valid ULID works; this one was generated once for the lab.
lab_mas_keycloak_provider_id: 01M5MXJ0M87K1Q6HEADGFT47CR

# ---------------------------------------------------------------------------------------------
# ACME external account binding (EAB) for Traefik on the Matrix VM
# ---------------------------------------------------------------------------------------------
# OpenBao's ACME server accepts only accounts bound to a key it handed out beforehand
# (eab_policy always-required, playbooks/vars/openbao-config.yml). The key's way, in one
# lab.ps1 deploy matrix:
#   matrix-prepare.yml   mints a key when Traefik needs a new ACME account and leaves it in
#                        lab_acme_eab_file, readable by root only, on the Matrix VM
#   matrix/lab-setup.yml reads it there and puts it into Traefik's ACME configuration (vars.yml)
#   matrix-check.yml     once Traefik serves certificates from the current CA: removes the used
#                        key and writes lab_acme_bound_marker ("the account in acme.json is a
#                        bound one"). The marker lies next to acme.json and goes with it.
lab_acme_eab_file: /root/lab-acme-eab.json
lab_acme_bound_marker: /matrix/traefik/ssl/lab-acme-account-bound
