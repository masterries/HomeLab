# The dedicated ingress VM runs only Ubuntu's nginx and its official stream module.
# No Docker, application database, standing deployment credentials or TLS private keys.
- name: Central Nginx domain routing
  hosts: nginx_servers
  become: true
  vars:
    nginx_ip: "{{ (lab_config.vms | selectattr('name', 'equalto', 'nginx') | first).ip }}"
    nginx_routes: "{{ lookup('file', inventory_dir ~ '/../config/nginx.json') | from_json }}"
    nginx_backend_addresses: "{{ dict(lab_config.vms | map(attribute='name') | zip(lab_config.vms | map(attribute='ip'))) | combine({'firewall': lab_config.firewall.lanIp}) }}"
    # The VMs whose routed HTTPS port (443 to nginx) lab.json limits to the PC, and the firewall
    # (its GUI). Only that port reaches a TLS route; a direct port's source is the firewall's
    # business alone (its forward).
    nginx_pc_only_vms: >-
      {%- set ns = namespace(out=['firewall']) -%}
      {%- for pub in lab_config.published -%}
      {%- if pub.ports | selectattr('targetVm', 'defined') | selectattr('targetVm', 'equalto', 'nginx')
             | selectattr('port', 'equalto', 443) | selectattr('source', 'defined')
             | selectattr('source', 'equalto', 'pc') | list | length > 0 -%}
      {%- set ns.out = ns.out + [pub.vm] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.out }}
  tasks:
    - name: Supported Ubuntu VM
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - nginx_routes.tls | length > 0
        quiet: true

    - name: Validate backend addresses and ports
      ansible.builtin.assert:
        that:
          - item.vm in nginx_backend_addresses
          - item.vm not in ['nginx', 'ansible-control']
          - item.port | int > 0 and item.port | int < 65536
        quiet: true
      loop: "{{ nginx_routes.tls + nginx_routes.http + (nginx_routes.tcp | default([])) }}"

    - name: Validate the source policy of the TLS routes
      ansible.builtin.assert:
        that: item.source | default('any') in ['any', 'management']
        quiet: true
      loop: "{{ nginx_routes.tls }}"
      loop_control:
        label: "{{ item.vm }}"

    # No backend may trust what nginx says about a client: OpenBao, the one service that binds
    # logins to client addresses, is forwarded directly by the firewall and never routed here.
    - name: No route sends client-address metadata (PROXY protocol), and OpenBao is not routed
      ansible.builtin.assert:
        that:
          - not (item.proxyProtocol | default(false) | bool)
          - item.vm != 'vault'
        quiet: true
      loop: "{{ nginx_routes.tls + nginx_routes.http + (nginx_routes.tcp | default([])) }}"

    # The management source policy (PC and LabNet only) protects the firewall GUI and every
    # publication whose routed HTTPS port lab.json limits to the PC (RustFS, Rancher, Hubble UI,
    # which has no login): a route of theirs must not lose "source": "management" by an edit of
    # nginx.json.
    - name: PC-only publications keep nginx's management source policy
      ansible.builtin.assert:
        that: (item.source | default('any') == 'management') == (item.vm in nginx_pc_only_vms)
        fail_msg: >-
          The route for {{ item.vm }} ({{ item.names | join(', ') }}) in config/nginx.json must have
          "source": "management" exactly when lab.json publishes it for the PC only (or it is the firewall).
        quiet: true
      loop: "{{ nginx_routes.tls }}"
      loop_control:
        label: "{{ item.vm }}"

    # nginx enforces "source" only in the TLS routes (the stream geo/map); an HTTP or TCP route
    # would ignore it and let any client in through another published address. So: no "source"
    # there, and no plain HTTP or TCP route to a PC-only VM.
    - name: Only TLS routes carry a source policy, and PC-only VMs get no HTTP or TCP route
      ansible.builtin.assert:
        that:
          - item.source is not defined
          - item.vm not in nginx_pc_only_vms
        fail_msg: >-
          config/nginx.json: the http/tcp route to {{ item.vm }} must have no "source" (nginx enforces
          it only for TLS routes), and a VM that lab.json publishes for the PC only (or the firewall)
          must not get an http or tcp route.
        quiet: true
      loop: "{{ nginx_routes.http + (nginx_routes.tcp | default([])) }}"
      loop_control:
        label: "{{ item.vm }}"

    - name: Validate plain TCP passthrough listeners (lab-internal, same port on the backend)
      ansible.builtin.assert:
        that:
          - item.listen | int == item.port | int
          - item.listen | int not in [80, 443]
        quiet: true
      loop: "{{ nginx_routes.tcp | default([]) }}"

    - name: Validate unique domain names per protocol
      ansible.builtin.assert:
        that:
          - (nginx_routes[item] | map(attribute='names') | flatten | unique | length) == (nginx_routes[item] | map(attribute='names') | flatten | length)
        quiet: true
      loop: [tls, http]

    - name: Validate domain labels before rendering nginx directives
      ansible.builtin.assert:
        that:
          - item is match('^(@|[a-z0-9][a-z0-9.-]*[a-z0-9]|[a-z0-9])$')
          - item not in ['ansible-control', 'nginx']
        quiet: true
      loop: "{{ (nginx_routes.tls + nginx_routes.http) | map(attribute='names') | flatten | unique }}"

    - name: Discover base image services
      ansible.builtin.service_facts:

    - name: Disable the unused base image RPC port mapper
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop: [rpcbind.socket, rpcbind.service]
      when: "'rpcbind.service' in ansible_facts.services"

    - name: Nginx and its Ubuntu stream module
      ansible.builtin.apt:
        name: [nginx, libnginx-mod-stream]
        state: present
        update_cache: true
        cache_valid_time: 3600
        policy_rc_d: 101

    - name: Nginx systemd configuration directory
      ansible.builtin.file:
        path: /etc/systemd/system/nginx.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Central TLS and HTTP domain configuration
      ansible.builtin.template:
        src: ../templates/nginx/nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/nginx -t -c %s
      notify: reload nginx

    - name: Nginx service hardening
      ansible.builtin.template:
        src: ../templates/nginx/hardening.conf.j2
        dest: /etc/systemd/system/nginx.service.d/20-lab.conf
        owner: root
        group: root
        mode: "0644"
      notify: restart nginx

    - name: Lab root CA for operators and subsequent endpoint checks
      ansible.builtin.copy:
        src: "{{ lab_pki_dir }}/root-ca.crt"
        dest: /usr/local/share/ca-certificates/lab-root-ca-2026.crt
        mode: "0644"
      notify: update CA bundle

    - name: Nginx enabled and started
      ansible.builtin.systemd_service:
        name: nginx
        daemon_reload: true
        enabled: true
        state: started

    - name: Apply Nginx configuration and service changes
      ansible.builtin.meta: flush_handlers

    - name: HTTPS routing listener is ready
      ansible.builtin.wait_for:
        host: "{{ nginx_ip }}"
        port: 443
        timeout: 30
      when: not ansible_check_mode

    - name: Every TCP passthrough listener reaches its backend
      ansible.builtin.wait_for:
        host: "{{ nginx_ip }}"
        port: "{{ item.listen }}"
        timeout: 30
      loop: "{{ nginx_routes.tcp | default([]) }}"
      loop_control:
        label: "{{ item.listen }} -> {{ item.vm }}:{{ item.port }}"
      delegate_to: ansible-control
      become: false
      when: not ansible_check_mode

  handlers:
    - name: reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

    - name: restart nginx
      ansible.builtin.systemd_service:
        name: nginx
        daemon_reload: true
        state: restarted

    - name: update CA bundle
      ansible.builtin.command: update-ca-certificates
