# playbooks/tasks/openbao-secrets.yml -- read secrets from OpenBao's KV store, and create the
# missing ones once
#
# Where it is used:
#   Included by keycloak.yml and matrix-prepare.yml, and by ansible/matrix/lab-setup.yml (the
#   lab's entry point into matrix-docker-ansible-deploy). Include it in a play that runs on
#   ansible-control itself ("control" or "localhost"): every request goes from there to OpenBao.
#
# Where the token comes from:
#   The environment. bin/openbao-run sets VAULT_ADDR, VAULT_CACERT and VAULT_TOKEN for one run
#   (a token minted by the PC for this run only, see scripts/LabSecrets.ps1, New-LabRunToken).
#   These are the standard variable names of the bao/vault CLI and of Ansible's
#   community.hashi_vault collection. The lab talks to OpenBao's HTTP API with plain
#   ansible.builtin.uri instead: no extra Python library (hvac) to install, and every request is
#   visible here. Enterprise equivalent: community.hashi_vault lookups, or Vault Agent writing
#   secrets for the automation.
#
# Input (variables of the include):
#   openbao_secrets         list of entries:
#     path                  below the KV mount "lab", e.g. keycloak/db
#     field                 the field inside that secret, e.g. password
#     policy                (optional) OpenBao password policy that generates the value if the
#                           secret does not exist yet: lab-alnum-24, -48 or -64 (letters and
#                           digits; Deploy-LabVault.ps1 defines them). Without a policy the secret
#                           must already exist: it belongs to another playbook (the client secret
#                           Keycloak shares with MAS, for example).
#   openbao_existing_state  true when the service already holds data that was set up with these
#                           secrets (a database, for example). A missing secret is then an error
#                           and never generated: a new database password would not open the
#                           existing database.
# Output:
#   lab_secrets             dictionary "path" -> value. A fact of this host, in memory, for this
#                           run only: nothing is written to disk on ansible-control (module
#                           arguments go through stdin - "pipelining" in ansible.cfg - and
#                           Ansible's temporary files are on a RAM disk, see bin/openbao-run).
#
# Check mode (--check): the reads below run anyway (check_mode: false; a read changes nothing,
# and without the values nothing else could be checked); nothing is written to OpenBao.
#
# Writes are "create only": the write carries cas=0 ("check and set": only if the secret has no
# version yet; the KV mount requires a cas value on every write), and the policies grant
# "create" but not "update". So a playbook can add a missing secret, but never overwrite one.
#
# No secret in the output: every task that carries the token or a secret value has
# no_log: true, which also hides its error messages. So each of them is followed by a check that
# reports only paths and HTTP status codes.
- name: OpenBao run token present
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'VAULT_TOKEN') | length > 0
      - lookup('ansible.builtin.env', 'VAULT_ADDR') | length > 0
    fail_msg: >-
      No OpenBao token in the environment. Start this playbook from the PC with
      .\scripts\Invoke-LabPlaybook.ps1 (or Deploy-LabKeycloak.ps1 / Deploy-LabMatrix.ps1):
      they create a short-lived token for the run.
    quiet: true

# KV version 2 keeps secrets under <mount>/data/<path>; the answer has the fields in data.data.
- name: Read the secrets from OpenBao
  ansible.builtin.uri:
    url: "{{ lookup('ansible.builtin.env', 'VAULT_ADDR') }}/v1/lab/data/{{ item.path }}"
    headers:
      X-Vault-Token: "{{ lookup('ansible.builtin.env', 'VAULT_TOKEN') }}"
    ca_path: "{{ lookup('ansible.builtin.env', 'VAULT_CACERT') }}"
    status_code: [200, 404]
  loop: "{{ openbao_secrets }}"
  register: openbao_read
  failed_when: false
  no_log: true
  # uri does not support check mode and would be skipped, leaving no status for the checks.
  check_mode: false

# 404 = not there yet. Typical other answers: 403 = the run token lacks the policy for that path
# (or has expired), 503 = OpenBao is sealed (.\scripts\Unlock-LabVault.ps1), -1 = not reachable.
- name: OpenBao answered every read
  ansible.builtin.assert:
    that:
      - openbao_read.results | rejectattr('status', 'in', [200, 404]) | list | length == 0
      - openbao_read.results | selectattr('status', 'eq', 200) | rejectattr('json.data.data', 'defined') | list | length == 0
    fail_msg: >-
      Reading from OpenBao failed for:
      {% for r in openbao_read.results if r.status not in [200, 404] or (r.status == 200 and r.json.data.data is not defined) %}
      {{ r.item.path }} (HTTP {{ r.status }}{{ (': ' ~ (r.json.errors | join(' '))) if (r.json.errors | default([])) else '' }}){{ ', ' if not loop.last else '' }}
      {% endfor %}
    quiet: true

- name: Secrets that are missing in OpenBao
  ansible.builtin.set_fact:
    openbao_missing: "{{ openbao_read.results | selectattr('status', 'eq', 404) | map(attribute='item') | list }}"

- name: Missing secrets may only be created for a new installation
  ansible.builtin.assert:
    that:
      - openbao_missing | length == 0 or not (openbao_existing_state | default(false) | bool)
      - openbao_missing | rejectattr('policy', 'defined') | list | length == 0
    fail_msg: >-
      Not in OpenBao: {{ openbao_missing | map(attribute='path') | join(', ') }}.
      {% if openbao_missing | rejectattr('policy', 'defined') | list | length > 0 %}
      {{ openbao_missing | rejectattr('policy', 'defined') | map(attribute='path') | join(', ') }}
      belongs to another part of the lab and is created there (Keycloak's secrets by
      .\scripts\Deploy-LabKeycloak.ps1).
      {% else %}
      The service already has data that was set up with the old values, so new values are NOT
      generated (they would not match). Restore OpenBao from a snapshot, or put the old values
      back into OpenBao.
      {% endif %}
    quiet: true

# OpenBao generates the value itself (GET sys/policies/password/<policy>/generate), from the
# operating system's cryptographic random number generator.
- name: Generate the missing secrets
  ansible.builtin.uri:
    url: "{{ lookup('ansible.builtin.env', 'VAULT_ADDR') }}/v1/sys/policies/password/{{ item.policy }}/generate"
    headers:
      X-Vault-Token: "{{ lookup('ansible.builtin.env', 'VAULT_TOKEN') }}"
    ca_path: "{{ lookup('ansible.builtin.env', 'VAULT_CACERT') }}"
  loop: "{{ openbao_missing }}"
  register: openbao_generated
  failed_when: false
  no_log: true
  # Only returns a value, stores nothing; the "Store" task below stays skipped under --check.
  check_mode: false

- name: OpenBao generated every missing secret
  ansible.builtin.assert:
    that: openbao_generated.results | rejectattr('status', 'eq', 200) | list | length == 0
    fail_msg: >-
      Generating secrets in OpenBao failed:
      {% for r in (openbao_generated.results | rejectattr('status', 'eq', 200)) %}{{ r.item.path }} (HTTP {{ r.status }}{{ (': ' ~ (r.json.errors | join(' '))) if (r.json.errors | default([])) else '' }}) {% endfor %}
    quiet: true
  when: openbao_missing | length > 0

- name: Store the new secrets in OpenBao (create only)
  ansible.builtin.uri:
    url: "{{ lookup('ansible.builtin.env', 'VAULT_ADDR') }}/v1/lab/data/{{ item.item.path }}"
    method: POST
    headers:
      X-Vault-Token: "{{ lookup('ansible.builtin.env', 'VAULT_TOKEN') }}"
    ca_path: "{{ lookup('ansible.builtin.env', 'VAULT_CACERT') }}"
    body_format: json
    body:
      options:
        cas: 0
      data: "{{ {item.item.field: item.json.data.password} }}"
  loop: "{{ openbao_generated.results | selectattr('status', 'eq', 200) | list }}"
  register: openbao_written
  failed_when: false
  no_log: true
  changed_when: true

# Skipped under --check: the store task did not run there, so its results have no status.
- name: OpenBao stored every new secret
  ansible.builtin.assert:
    that: openbao_written.results | rejectattr('status', 'eq', 200) | list | length == 0
    fail_msg: >-
      Storing secrets in OpenBao failed:
      {% for r in (openbao_written.results | rejectattr('status', 'eq', 200)) %}{{ r.item.item.path }} (HTTP {{ r.status }}{{ (': ' ~ (r.json.errors | join(' '))) if (r.json.errors | default([])) else '' }}) {% endfor %}
    quiet: true
  when: openbao_missing | length > 0 and not ansible_check_mode

# A secret that exists but lacks the expected field is left out here (instead of failing inside
# this no_log task, which would hide which one it is); the last check below names it.
- name: Secrets for this run (existing ones)
  ansible.builtin.set_fact:
    lab_secrets: "{{ lab_secrets | default({}) | combine({item.item.path: item.json.data.data[item.item.field]} if item.item.field in item.json.data.data else {}) }}"
  loop: "{{ openbao_read.results | selectattr('status', 'eq', 200) | list }}"
  no_log: true

- name: Secrets for this run (just created)
  ansible.builtin.set_fact:
    lab_secrets: "{{ lab_secrets | default({}) | combine({item.item.item.path: item.item.json.data.password}) }}"
  loop: "{{ openbao_written.results | default([]) }}"
  no_log: true

- name: Every requested secret is available
  ansible.builtin.assert:
    that: openbao_secrets | map(attribute='path') | difference((lab_secrets | default({})).keys() | list) | length == 0
    fail_msg: >-
      Missing after reading OpenBao:
      {% for s in openbao_secrets if s.path not in (lab_secrets | default({})) %}lab/{{ s.path }} (field {{ s.field }}){{ ', ' if not loop.last else '' }}{% endfor %}.
      A secret that exists but has no such field was probably written by hand under another
      field name.
    quiet: true
