# playbooks/vars/keycloak-secrets.yml -- the Keycloak secrets under the names the templates and
# tasks use
#
# Loaded with vars_files by the plays of keycloak.yml that need the secrets. The values are
# not here: each name points to what tasks/openbao-secrets.yml read from OpenBao in the
# playbook's first play (the fact lab_secrets of ansible-control, in memory for this run).
# Ansible evaluates these expressions only when a value is used ("lazy evaluation"), so loading
# this file reads nothing by itself.
#
# Where each secret lives in OpenBao (KV mount "lab"; see them with
# .\lab.ps1 secret -List):
#   keycloak/db                                  password of Keycloak's database user
#   keycloak/admin                               the bootstrap administrator "admin"
#   keycloak/clients/lab-ansible                 the client Ansible uses for the admin API
#   keycloak/clients/matrix-authentication-service  the OIDC client secret shared with MAS
#   keycloak/users/alice, keycloak/users/bob     the lab users' login passwords
# The "vault_" prefix is the usual Ansible convention for values that come from a vault.
vault_keycloak_db_password: "{{ hostvars['ansible-control'].lab_secrets['keycloak/db'] }}"
vault_keycloak_admin_password: "{{ hostvars['ansible-control'].lab_secrets['keycloak/admin'] }}"
vault_keycloak_ansible_client_secret: "{{ hostvars['ansible-control'].lab_secrets['keycloak/clients/lab-ansible'] }}"
vault_mas_keycloak_client_secret: "{{ hostvars['ansible-control'].lab_secrets['keycloak/clients/matrix-authentication-service'] }}"
vault_keycloak_alice_password: "{{ hostvars['ansible-control'].lab_secrets['keycloak/users/alice'] }}"
vault_keycloak_bob_password: "{{ hostvars['ansible-control'].lab_secrets['keycloak/users/bob'] }}"
