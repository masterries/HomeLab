# matrix/inventory/host_vars/matrix.lab.internal/vars.yml -- our configuration of the Matrix
# stack, as variables for matrix-docker-ansible-deploy (MDAD)
#
# Where it is used:
#   Copied by ansible/playbooks/matrix-prepare.yml to ~/mdad/inventory/host_vars/
#   matrix.lab.internal/ on ansible-control, next to lab-shared.yml (values shared with the lab's
#   own inventory, generated by matrix-prepare.yml). Ansible loads every file in that folder for
#   the host matrix.lab.internal. Applied by .\scripts\Deploy-LabMatrix.ps1, through the lab's
#   entry point ansible/matrix/lab-setup.yml.
#
# How MDAD's variables work:
#   MDAD has thousands of variables with sensible defaults (roles/*/defaults/main.yml and
#   group_vars/matrix_servers in the MDAD repository). This file only sets what differs for this
#   lab. The names below were checked against the pinned MDAD version (mdad_version in
#   matrix-prepare.yml); when you move to a newer version, read MDAD's CHANGELOG.md first.
#
# The lab's special situation, and how this file handles it:
#   - Private domain lab.internal: no public DNS, no Let's Encrypt. TLS certificates come from
#     the lab's own ACME server, OpenBao's intermediate CA (section "TLS").
#   - Only one client machine, your PC, which reaches the server only through the firewall's
#     published address 10.10.99.3 (DNAT). LiveKit must announce that address (section "Calls").
#   - No federation with other Matrix servers, no outgoing mail, no public services in Element.
#
# Secrets: the values "{{ vault_... }}" are not in any file. They live in OpenBao (KV mount
# "lab": matrix/generic-secret-key, matrix/postgres, keycloak/clients/matrix-authentication-service),
# created once by matrix-prepare.yml (or Keycloak's playbook), and lab-setup.yml reads them into
# memory at the start of every MDAD run. The "vault_" prefix is the usual Ansible convention for
# values that come from a vault.

# =============================================================================================
# Basics
# =============================================================================================

# MDAD refuses to run until you confirm that you have read its migration notes up to this
# version (CHANGELOG.md). Raise it deliberately together with mdad_version.
matrix_playbook_migration_validated_version: v2026.05.18.0

# MDAD normally records its own version on the server (/matrix/git_hash.yml) with
# "git describe" in its folder on ansible-control. The lab's copy of MDAD comes from this
# repository (vendor\mdad) without git history, so that would fail; the version is known
# anyway (vendor\mdad\.lab-vendored-commit, mdad_version in matrix-prepare.yml). MDAD's copy of
# this vars.yml on the server (/matrix/vars.yml) is still kept.
devture_playbook_state_preserver_commit_hash_preservation_enabled: false

# The server name: user IDs look like @alice:lab.internal. It is part of every user ID and room
# ID in the database, so it CANNOT be changed after the first installation (only by starting
# over with an empty database).
matrix_domain: lab.internal

# Synapse, the reference homeserver. The only one that supports all features Element Call
# needs. Also fixed after the first installation.
matrix_homeserver_implementation: synapse

# Master secret: MDAD derives further secrets from it (Synapse's database password, its
# macaroon key, LiveKit's API key and secret, ...). Changing it later breaks the installation,
# which is why it is created only once in OpenBao and never overwritten there.
matrix_homeserver_generic_secret_key: "{{ vault_matrix_homeserver_generic_secret_key }}"

# Password of the PostgreSQL superuser "matrix" (must be shorter than 100 characters).
postgres_connection_password: "{{ vault_postgres_connection_password }}"

# MDAD's own Traefik as reverse proxy: it terminates TLS on 80/443 (and 8448) and routes each
# request by host name and path to the right container.
matrix_playbook_reverse_proxy_type: playbook-managed-traefik

# IPv6 inside Docker's networks, as recommended by MDAD's example configuration. Fixed early:
# changing it later means recreating all container networks.
devture_systemd_docker_base_ipv6_enabled: true

# =============================================================================================
# Federation: off
# =============================================================================================
# Federation is the server-to-server API that lets users talk to other Matrix servers. The lab
# is isolated, so it is switched off. Synapse still keeps its federation port 8448 open with
# ONLY the "openid" endpoint: the LiveKit JWT service uses it to check who a caller is (see
# "Calls"). Do not switch that port off, or calls break.
matrix_homeserver_federation_enabled: false

# =============================================================================================
# Base domain: https://lab.internal/.well-known/matrix/...
# =============================================================================================
# The ".well-known" files tell clients and services which server hosts the accounts of
# @name:lab.internal ("delegation" from lab.internal to matrix.lab.internal). Normally they are
# served by the company's main web site; here the domain has no other web site, so MDAD serves
# them itself. Needs the DNS name lab.internal ("@" under "published" in config/lab.json) and
# a certificate for it (Traefik requests one through ACME). The LiveKit JWT service reads
# https://lab.internal/.well-known/matrix/server on every call.
matrix_static_files_container_labels_base_domain_enabled: true

# =============================================================================================
# TLS: certificates through ACME from OpenBao instead of Let's Encrypt
# =============================================================================================
# By default Traefik gets its certificates from Let's Encrypt with ACME, the protocol that
# automates certificates: the client proves it controls a name (HTTP-01: the CA fetches a token
# from http://<name>/.well-known/acme-challenge/...), receives a certificate, and renews it
# itself before it expires. Let's Encrypt only issues certificates for public names, so here
# Traefik asks the lab's own ACME server instead: OpenBao's intermediate CA, role "acme-matrix"
# (Deploy-LabVault.ps1). That role allows exactly matrix.lab.internal, element.lab.internal and
# lab.internal and issues 90-day certificates. OpenBao checks each name from the vault VM
# (lab DNS: 10.10.10.30, port 80); Traefik answers the challenge itself. The private keys are
# made by Traefik and never leave the Matrix VM (stored in /matrix/traefik/ssl/acme.json).
# Your PC trusts the lab root CA, so browsers accept the certificates.
# Enterprise equivalent: exactly this - an internal ACME CA (Vault/OpenBao PKI, smallstep
# step-ca, Microsoft AD CS with an ACME gateway) and ACME clients on the servers.
traefik_config_certificatesResolvers_acme_enabled: true
traefik_config_certificatesResolvers_acme_caServer: "{{ lab_vault_url }}/v1/pki_int/roles/acme-matrix/acme/directory"

# Traefik talks to OpenBao over HTTPS, so it must trust the lab root CA, which its container
# image does not know. The root (installed on the VM by matrix-prepare.yml) is mounted into the
# container, and the ACME settings below point Traefik at it. Also: EC P-256 keys instead of
# Traefik's default RSA 4096 (smaller, faster, what the other lab certificates use), and the
# certificates' real lifetime (90 days), from which Traefik computes when to renew (after 2/3).
traefik_container_additional_volumes_custom:
  - type: bind
    src: /usr/local/share/ca-certificates/lab-root-ca-2026.crt
    dst: /etc/traefik-lab/lab-root-ca-2026.crt
    options: readonly
traefik_configuration_extension_yaml: |
  certificatesResolvers:
    default:
      acme:
        caCertificates:
          - /etc/traefik-lab/lab-root-ca-2026.crt
        keyType: EC256
        certificatesDuration: 2160

# The "certs dumper" copies ACME certificates out of acme.json for services that need them as
# files (a TURN server, mail bridges). None of them runs here.
traefik_certs_dumper_enabled: false

# HTTP/3 (QUIC) would need UDP 443, which the firewall does not forward. Browsers fall back to
# HTTP/2 over TCP anyway; switching it off avoids announcing something that cannot work.
traefik_config_entrypoint_web_secure_http3_enabled: false

# =============================================================================================
# Calls: MatrixRTC with LiveKit (voice and video in Element)
# =============================================================================================
# The "Matrix RTC stack": LiveKit Server, an SFU (selective forwarding unit: every participant
# sends its audio/video once to the SFU, which forwards it to the others), and the LiveKit JWT
# service, which checks a caller's Matrix identity and hands out a LiveKit access token.
# Element Web contains the Element Call user interface, so the separate Element Call web app is
# not installed. MDAD also switches on the Synapse features calls need.
matrix_rtc_enabled: true

# Which address LiveKit announces to browsers as "send your media here" (ICE candidates).
# By default it asks a public STUN server for its public IP; in the lab that would be your home
# router's internet address, which is wrong. Your PC reaches the server only as 10.10.99.3
# (the firewall forwards UDP 7882 and TCP 7881 there unchanged), so LiveKit announces exactly
# that. Enterprise equivalent: the public IP of a DMZ or load balancer in front of the SFU.
# A copy of the matrix entry's "address" under "published" in config/lab.json: if that
# changes, change it here too and run .\scripts\Deploy-LabMatrix.ps1.
livekit_server_config_rtc_use_external_ip: false
livekit_server_config_rtc_node_ip: "10.10.99.3"

# LiveKit's built-in TURN server (a relay for clients behind strict NATs) is not needed: the
# PC reaches the SFU directly through the port forwards. MDAD would switch it on (because TLS
# is on), and it would need three more ports on the firewall.
livekit_server_config_turn_enabled: false

# The LiveKit JWT service makes HTTPS calls to lab.internal and matrix.lab.internal, whose
# certificates come from the lab's CA (OpenBao). Its container image only knows public CAs, so
# the server's own CA bundle (which contains the lab root, installed by matrix-prepare.yml) is
# mounted into it, read-only. Enterprise equivalent: distributing the internal root CA to every system and
# container image.
matrix_livekit_jwt_service_container_additional_volumes_custom:
  - type: bind
    src: /etc/ssl/certs/ca-certificates.crt
    dst: /etc/ssl/certs/ca-certificates.crt
    options: readonly

# Element Web: use Element Call for every call, also 1:1 calls in direct messages. Without it,
# 1:1 calls would use the older peer-to-peer calling, which normally needs a TURN server.
matrix_client_element_element_call_enabled: true

# =============================================================================================
# Isolated lab: no mail, no public services
# =============================================================================================
# The mail relay could not deliver anything from the lab.
exim_relay_enabled: false

# Element Web's defaults point to public services: the room directory of matrix.org, links via
# matrix.to, bug reports to element.io and the integration manager (scalar.vector.im). None of
# them is reachable or wanted here.
matrix_client_element_room_directory_servers: ["{{ matrix_domain }}"]
matrix_client_element_permalink_prefix: "https://{{ matrix_server_fqn_element }}"
matrix_client_element_bug_report_endpoint_url: ~
# These values are written into Element's config.json as text, so ~ would become "None"; the
# JSON extension sets them to a real null instead.
matrix_client_element_configuration_extension_json: |
  {
    "integrations_ui_url": null,
    "integrations_rest_url": null,
    "integrations_widgets_urls": null,
    "integrations_jitsi_widget_url": null
  }

# =============================================================================================
# Login: Matrix Authentication Service (MAS) with Keycloak as the only identity provider
# =============================================================================================
# MAS takes over everything around login from Synapse ("next-gen auth", the Matrix OAuth 2.0
# API): login pages, sessions, tokens, account management. It is itself an OAuth 2.0 / OIDC
# server for the Matrix clients (Element signs in through it), and it delegates the actual
# identity check to an "upstream" identity provider, here Keycloak. Result: users log in with
# their central Keycloak account (single sign-on); Matrix stores no passwords at all.
# MDAD wires the rest automatically: Synapse delegates to MAS, /_matrix/client/*/login is
# routed to MAS, Element uses the OIDC login flow, the well-known file announces MAS.
# MAS is served at https://matrix.lab.internal/auth/ (no extra DNS name or certificate).
# Note: MDAD still calls MAS "experimental", although it is the direction Matrix has taken
# (Element X requires it).
matrix_authentication_service_enabled: true

# Key that encrypts secrets inside MAS's database (64 hex characters, checked by MDAD). Derived
# from the master secret, the same way MDAD derives MAS's database password, so no extra
# secret to keep. Like the master secret it must never change after the first start.
matrix_authentication_service_config_secrets_encryption: "{{ (matrix_homeserver_generic_secret_key + ':mas.enc') | hash('sha256') }}"

# No local passwords in MAS: Keycloak is the only way to log in. With exactly one upstream
# provider and no passwords, MAS sends the browser straight to Keycloak's login page.
# Consequence: MDAD's "register-user" and its automatic user creation (which set passwords) do
# not work; Matrix accounts are created on a user's first Keycloak login instead.
matrix_authentication_service_config_passwords_enabled: false
# The email address comes from Keycloak; users cannot change it in MAS.
matrix_authentication_service_config_account_email_change_allowed: false

# The upstream provider: Keycloak's realm "lab". The lab_* values are defined once in
# ansible/inventory/group_vars/all.yml (matrix-prepare.yml writes them into lab-shared.yml next
# to this file); the client secret comes from OpenBao (lab-setup.yml).
# The MAS templates ({{ user.... }}) are wrapped in {% raw %}: they are for MAS, which fills
# them in at login time, and Ansible must leave them untouched.
matrix_authentication_service_config_upstream_oauth2_providers:
  - id: "{{ lab_mas_keycloak_provider_id }}"
    human_name: Lab Keycloak
    # Must match exactly what Keycloak publishes (no trailing slash).
    issuer: "{{ lab_keycloak_issuer }}"
    client_id: "{{ lab_mas_keycloak_client_id }}"
    client_secret: "{{ vault_mas_keycloak_client_secret }}"
    token_endpoint_auth_method: client_secret_basic
    scope: "openid profile email"
    # Read Keycloak's endpoints from its discovery document, and check them strictly.
    discovery_mode: oidc
    # PKCE protects the authorization code; the Keycloak client enforces it (S256).
    pkce_method: always
    # Ask Keycloak's userinfo endpoint for the user's details instead of relying on which
    # claims happen to be in the ID token.
    fetch_userinfo: true
    # When Keycloak reports a logout (back-channel), end the MAS browser session.
    on_backchannel_logout: logout_browser_only
    # After signing out in MAS, ask Keycloak for the password again (otherwise Keycloak's still
    # valid session would log the user straight back in).
    additional_authorization_parameters:
      prompt: "{% raw %}{% if logged_out %}login{% endif %}{% endraw %}"
    # How a Keycloak user becomes a Matrix user, on the first login:
    claims_imports:
      # No "create account?" page: the account is created directly from Keycloak's data.
      skip_confirmation: true
      # The stable link between the two accounts: Keycloak's user ID ("sub").
      subject:
        template: "{% raw %}{{ user.sub }}{% endraw %}"
      # Keycloak username alice -> Matrix user @alice:lab.internal (required: no username, no login).
      # on_conflict "replace": if the Matrix account alice already exists but is linked to an
      # older Keycloak user ID (after Keycloak was rebuilt, its users get new IDs), re-link it
      # instead of refusing the login. LAB TRADE-OFF: whoever can create users in Keycloak can
      # take over the Matrix account of the same name - acceptable because Keycloak is the sole
      # authority anyway. Enterprise: keep the default "fail" and back up Keycloak so IDs stay.
      localpart:
        action: require
        template: "{% raw %}{{ user.preferred_username }}{% endraw %}"
        on_conflict: replace
      displayname:
        action: force
        template: "{% raw %}{{ user.name }}{% endraw %}"
      email:
        action: force
        template: "{% raw %}{{ user.email }}{% endraw %}"
      account_name:
        template: "{% raw %}{{ user.preferred_username }}{% endraw %}"

# MAS calls Keycloak over HTTPS (discovery, token, userinfo) and must trust the lab root CA.
# Its container image has no option for extra CAs, so - as for the LiveKit JWT service above -
# the VM's CA bundle (which contains the lab root, installed by matrix-prepare.yml) is mounted
# into it, and SSL_CERT_FILE points MAS's TLS library at it. MAS reads it once at start, so
# matrix-prepare.yml restarts MAS (and the JWT service) whenever the bundle changes.
matrix_authentication_service_container_extra_arguments:
  - "--mount type=bind,src=/etc/ssl/certs/ca-certificates.crt,dst=/etc/ssl/certs/ca-certificates.crt,ro"
matrix_authentication_service_environment_variables_extension: |
  SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt

# The Matrix administrator, declared in MAS's policy: alice may request admin rights in admin
# tools (Synapse's admin API). It does not make Element show anything extra.
matrix_authentication_service_configuration_extension_yaml: |
  policy:
    data:
      admin_users:
        - alice
