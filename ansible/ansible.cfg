# ansible.cfg -- settings for the lab's Ansible project
#
# What it is:
#   The configuration file that ansible-playbook reads when it is started in this directory.
#   Ansible looks for its configuration in this order and uses the first one it finds:
#   $ANSIBLE_CONFIG, ./ansible.cfg (current directory), ~/.ansible.cfg, /etc/ansible/ansible.cfg.
#
# Where it runs:
#   On the VM "ansible-control", as user "ansible", in ~/lab. You never edit it there: the
#   source of truth is the folder ansible\ in this repository on the Windows host.
#   scripts/lib/LabRun.ps1 replaces ~/lab completely with a fresh copy of ansible\ and
#   then runs "ansible-playbook playbooks/<name>.yml" in ~/lab over SSH.
#
# Place in the architecture:
#   ansible-control is the control node: the one machine from which all configuration of the
#   lab VMs is pushed. This is infrastructure as code: the desired state of every server is
#   described in version-controlled files instead of being typed in by hand on each server.
#
# Security note:
#   Ansible ignores an ansible.cfg that lies in a world-writable directory, because any local
#   user could otherwise plant settings there. That is why lab.ps1 run runs
#   "chmod -R go-w" on the copied project.
#
# Note: in this file, comments must stand on their own lines. A "#" after a value is not
# treated as a comment; it would become part of the value.

[defaults]
# The inventory: which hosts exist and how they are grouped. This relative path is resolved
# relative to the directory of this file.
inventory = inventory/hosts.ini
# The user Ansible logs in as on the managed hosts: created on the Ubuntu VMs by Vagrant
# provisioning (provision/bootstrap-ansible-user.sh), on the firewall defined in
# opnsense/config.xml.template.
remote_user = ansible
# ansible-control's own SSH key, made on the VM by provision/bootstrap-ansible-control.sh. ssh
# finds the run's certificate next to it (~/.ssh/id_ed25519-cert.pub): the PC signs one before
# every run, valid 2 hours and only for the hosts of that run (scripts/lib/LabRun.ps1);
# without it the key opens nothing.
private_key_file = ~/.ssh/id_ed25519
# Ansible modules are small Python programs that run on the target. "auto_silent" lets Ansible
# find the Python interpreter on each target itself, without printing a warning about it.
interpreter_python = auto_silent
# Verify SSH host keys: every lab machine presents a host certificate from a lab SSH CA, and
# ansible-control trusts exactly those CAs for exactly the lab's names (/etc/ssh/ssh_known_hosts
# and /etc/ssh/ssh_config.d/20-lab.conf, provision/bootstrap-ansible-control.sh). A rebuilt VM
# gets a new certificate, so there is no "host key changed" error, and an impostor without one
# is refused.
host_key_checking = True

[connection]
# Pipelining: Ansible hands each module (a small Python program, with its arguments) to the
# target's Python on stdin instead of writing it as a file into ~/.ansible/tmp first. Faster,
# and the arguments - which can hold an OpenBao token or a secret (for example in the uri tasks
# of playbooks/tasks/openbao-secrets.yml) - do not land on disk. It needs sudo without
# "requiretty", which is Ubuntu's default. MDAD's own ansible.cfg switches it on as well.
pipelining = True

[colors]
# Ansible's default colour for verbose output (-v) is blue, which is unreadable on the blue
# background of Windows PowerShell, where the output of lab.ps1 run is shown.
verbose = magenta
